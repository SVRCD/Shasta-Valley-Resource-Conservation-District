<!DOCTYPE html>

  <style>
    body {
      margin: 0;
      background: #f5f1e8;

    .page {
      max-width: 470px;

}

      display: block;

      font-size: 13px;
      font-weight: normal;
    }

    .socials {
      display: flex;
      gap: 12px;
